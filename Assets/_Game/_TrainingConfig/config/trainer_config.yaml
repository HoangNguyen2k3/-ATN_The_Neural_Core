behaviors:
  AircraftLearn:
    trainer_type: ppo
    max_steps: 3500000
    time_horizon: 128
    summary_freq: 10000

    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        strength: 1.0
        gamma: 0.99
